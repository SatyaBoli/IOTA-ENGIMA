# Sentinel Candidate Configuration (B4: Deep Causal TCN-AE + Adaptive Ensemble)
detector:
  detector_type: "ensemble"
  window_size: 60
  scale_floor: 0.05
  ewma_alpha: 0.12
  iforest_n_estimators: 100
  ae_latent_dim: 16
  ae_epochs: 25
  ae_batch_size: 128
  ae_lr: 0.001
  ae_device: "cuda"

adaptation:
  enter_threshold: 6.5
  exit_threshold: 2.5
  min_event_length: 3
  cooldown_steps: 10
  warmup_steps: 40
  regime_shift_patience: 40
  max_score: 1000000.0
  detector_version: "sentinel-deep-0.2.0"
  threshold_mode: "likelihood"
  likelihood_long_window: 600
  likelihood_short_window: 10
  likelihood_min_samples: 30
  drift_enabled: true
  adwin_delta: 0.002
  adwin_max_window: 1000
  adwin_clock: 8
  adwin_min_sub_window: 10
  drift_refresh_steps: 40
