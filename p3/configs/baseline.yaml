# Sentinel baseline config. Tune on validation data, not on the test series.
adaptation:
  enter_threshold: 3.5
  exit_threshold: 2.0
  min_event_length: 1
  cooldown_steps: 3
  warmup_steps: 30
  regime_shift_patience: 50
  max_score: 1000000.0
  detector_version: "sentinel-0.1.0"
  threshold_mode: "robust_z"
  likelihood_long_window: 500
  likelihood_short_window: 10
  likelihood_min_samples: 30
  drift_enabled: true
  adwin_delta: 0.002
  adwin_max_window: 1000
  adwin_clock: 8
  adwin_min_sub_window: 10
  drift_refresh_steps: 50
